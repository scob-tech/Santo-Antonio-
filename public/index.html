<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scobtech · Atendimento — entrar</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:6px">
      <img src="/logo.png" alt="Academia DANDY" style="height:56px">
    </div>
    <h1 style="text-align:center">Central de Atendimento</h1>
    <p class="sub" style="text-align:center">WhatsApp + IA · powered by scobtech</p>

    <div class="papeis" id="papeis">
      <div class="papel" data-papel="gerente"><small>👤</small>Gerente</div>
      <div class="papel" data-papel="coordenador"><small>📊</small>Coordenador</div>
      <div class="papel" data-papel="vendedor"><small>💬</small>Vendedor</div>
    </div>

    <label class="campo">
      <span>Senha de acesso</span>
      <input id="senha" type="password" placeholder="••••••" autocomplete="off">
    </label>

    <div class="erro" id="erro"></div>
    <button class="btn primary" style="width:100%;justify-content:center" id="entrar">Entrar</button>
    <p class="sub" style="margin-top:14px;text-align:center">
      Fase 1 · acesso por papel. Login individual entra na Fase 2.
    </p>
  </div>
</div>

<script>
let papelSel = 'vendedor';
document.querySelectorAll('.papel').forEach(el=>{
  if(el.dataset.papel==='vendedor') el.classList.add('sel');
  el.onclick=()=>{
    document.querySelectorAll('.papel').forEach(p=>p.classList.remove('sel'));
    el.classList.add('sel'); papelSel=el.dataset.papel;
  };
});
document.getElementById('entrar').onclick = entrar;
document.getElementById('senha').addEventListener('keydown',e=>{ if(e.key==='Enter') entrar(); });

async function entrar(){
  const senha = document.getElementById('senha').value;
  const erro = document.getElementById('erro');
  erro.textContent='';
  try{
    const r = await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({senha, papel:papelSel})});
    const d = await r.json();
    if(!d.ok){ erro.textContent = d.erro || 'Não foi possível entrar.'; return; }
    sessionStorage.setItem('papel', d.papel);
    location.href='/painel.html';
  }catch(e){ erro.textContent='Erro de conexão.'; }
}
</script>
</body>
</html>
